<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Oficial - Reto Virtual VZLA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .hidden-step { display: none !important; }
        input:focus, select:focus, textarea:focus { 
            border-color: #00D2FF !important; 
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1); 
        }
        .req { color: #ef4444; font-weight: bold; margin-left: 2px; }
    </style>
</head>
<body class="text-slate-900">

    <div class="bg-[#001E50] text-white py-2 text-center text-[10px] font-bold uppercase tracking-[0.4em] z-50 relative border-b border-white/10">
        SISTEMA DE INSCRIPCIÓN INTELIGENTE TEAMFS
    </div>

    <nav class="bg-[#001E50] sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 md:px-12">
            <div class="flex justify-between items-center h-28">
                <div class="flex items-center gap-6 cursor-pointer group" onclick="window.location.href='index.html'">
                    <div class="flex flex-col text-left">
                        <span class="text-[9px] text-white/60 font-bold tracking-[0.3em] uppercase mb-1">Presentado por</span>
                        <span class="text-white font-black text-2xl md:text-4xl tracking-tighter leading-none group-hover:text-[#00D2FF] transition-colors italic uppercase">TEAMFS</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-16">
        
        <div id="paso-1" class="bg-white p-10 md:p-16 rounded-[3rem] shadow-2xl border border-slate-100 text-center">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6 text-[#001E50]">
                <i class="fa-solid fa-user-check text-3xl"></i>
            </div>
            <h2 class="text-[#001E50] font-black text-3xl uppercase tracking-tighter mb-4 italic">Validación de Fundador</h2>
            <p class="text-slate-400 text-sm mb-10">Ingresa tu cédula para recuperar tus datos de la 1era Edición.</p>
            
            <div class="max-w-xs mx-auto space-y-4">
                <input type="text" id="cedulaAtleta" placeholder="Ej: 12345678" 
                       class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 text-center font-bold outline-none transition-all text-lg">
                <button id="btnVerificar" onclick="validarAtleta()" class="w-full bg-[#001E50] text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-[#00D2FF] hover:text-[#001E50] transition-all shadow-xl">
                    Verificar Atleta
                </button>
            </div>
        </div>

        <div id="paso-fundador" class="hidden-step space-y-8 animate-fade-in mt-8">
            <div class="bg-[#00D2FF]/10 border-2 border-[#00D2FF] p-8 rounded-[2rem] text-center text-[#001E50]">
                <h3 class="font-black uppercase text-xl">¡Atleta Verificado!</h3>
                <p id="textoDorsal" class="text-sm font-bold uppercase tracking-widest mt-2 bg-[#001E50] text-white inline-block px-4 py-1 rounded-full">Dorsal: #---</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <label class="cursor-pointer group flex flex-col bg-white border-2 border-slate-200 p-8 rounded-[2rem] shadow-sm hover:shadow-xl hover:border-[#00D2FF] has-[:checked]:border-[#00D2FF] has-[:checked]:bg-[#00D2FF]/5 transition-all relative overflow-hidden">
                    <input type="radio" name="paqueteBase" value="15" onchange="actualizarTotal()" class="absolute top-8 right-8 w-6 h-6 accent-[#00D2FF]" checked>
                    <h4 class="font-black text-[#001E50] text-xl uppercase tracking-tighter">5K - 2da Edición</h4>
                    <p class="text-xs text-slate-400 font-bold uppercase mb-2">Registro de Resultados</p>
                    <p class="text-5xl font-black text-[#00D2FF] mt-2 mb-4">$15</p>
                </label>

                <label class="cursor-pointer group flex flex-col bg-white border-2 border-slate-200 p-8 rounded-[2rem] shadow-sm hover:shadow-xl hover:border-[#00D2FF] has-[:checked]:border-[#00D2FF] has-[:checked]:bg-[#00D2FF]/5 transition-all relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 to-[#00D2FF]"></div>
                    <input type="radio" name="paqueteBase" value="30" onchange="actualizarTotal()" class="absolute top-8 right-8 w-6 h-6 accent-[#00D2FF]">
                    <h4 class="font-black text-[#001E50] text-xl uppercase tracking-tighter">10K - Fundadores</h4>
                    <p class="text-xs text-yellow-600 font-bold uppercase mb-2">Paquete Premium VIP</p>
                    <p class="text-5xl font-black text-[#001E50] mt-2 mb-4">$30</p>
                </label>
            </div>

            <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100">
                <h3 class="text-[#001E50] font-black text-2xl mb-8 uppercase italic border-b pb-4">Datos de Registro</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Nombre Completo <span class="req">*</span></label>
                        <input type="text" id="nombreEnvio" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none" required>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Teléfono <span class="req">*</span></label>
                        <input type="text" id="telefonoEnvio" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none" required>
                    </div>
                    <div class="md:col-span-2 flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Referencia de Pago <span class="req">*</span></label>
                        <input type="text" id="numReferenciaPago" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none" required>
                    </div>
                </div>
            </div>

            <div class="bg-[#001E50] p-10 rounded-[3rem] text-white shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="font-black text-2xl uppercase">Total: <span id="total-usd" class="text-[#00D2FF]">$15</span></h4>
                    <p class="text-white/30 text-xs">Tasa BCV: 589.27</p>
                </div>
                <button id="btnInscribir" onclick="procesarInscripcion()" class="w-full bg-[#00D2FF] text-[#001E50] py-6 rounded-2xl font-black uppercase tracking-widest hover:scale-105 transition-all shadow-xl">
                    CONFIRMAR INSCRIPCIÓN
                </button>
            </div>
        </div>

    </main>

    <script>
        const tasaBCV = 589.27;
        
        // 1. FUENTE DE DATOS PARA COMPARAR (1era Edición)
        const urlCSV_Comparacion = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5yMHsenxCWE5kZBDUZ8UcYqDtdAHstfqXcvWkuYZPQ_4n2xSrfs6ptk7k21r1kcMHHLtWjz8SEHwl/pub?gid=0&single=true&output=csv";
        
        // 2. DESTINOS DE REGISTRO
        const GID_10K_FUNDADORES = "863906539";
        const GID_5K_2DA_EDICION = "368824798";
        
        // URL de tu Apps Script (Endpoint de escritura)
        const urlBaseDeDatos = "https://script.google.com/macros/s/AKfycbyp-NJc2uozcF4VDYRm3_XhKiKmPwdLfB4jLxJV_L9EFpXSBI7dp1TuMG0hxWzC7dLaCg/exec"; 

        let dorsalActual = "000";

        function actualizarTotal() {
            const precio = document.querySelector('input[name="paqueteBase"]:checked').value;
            document.getElementById('total-usd').innerText = `$${precio}`;
        }

        // FUNCIÓN INTELIGENTE DE VERIFICACIÓN
        async function validarAtleta() {
            const btn = document.getElementById('btnVerificar');
            const ciInput = document.getElementById('cedulaAtleta').value.replace(/\D/g, '');
            
            if(ciInput.length < 5) return alert("Ingresa una cédula válida.");

            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            try {
                const res = await fetch(urlCSV_Comparacion + "&nocache=" + new Date().getTime());
                const csvText = await res.text();
                const filas = csvText.split(/\r?\n/);
                
                let encontrado = false;

                // Buscador Inteligente de Columnas en el CSV de comparación
                const headers = filas[0].split(',').map(h => h.trim().toLowerCase());
                const idxCI = headers.findIndex(h => h.includes('cedula') || h.includes('ci'));
                const idxDorsal = headers.findIndex(h => h.includes('dorsal'));
                const idxNombre = headers.findIndex(h => h.includes('nombre'));

                for(let i = 1; i < filas.length; i++) {
                    const columnas = filas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                    if(columnas[idxCI] && columnas[idxCI].replace(/\D/g, '') === ciInput) {
                        encontrado = true;
                        dorsalActual = columnas[idxDorsal] || "000";
                        document.getElementById('nombreEnvio').value = columnas[idxNombre] || "";
                        document.getElementById('textoDorsal').innerText = "Dorsal Recuperado: #" + dorsalActual;
                        break;
                    }
                }

                if(encontrado) {
                    document.getElementById('paso-1').classList.add('hidden-step');
                    document.getElementById('paso-fundador').classList.remove('hidden-step');
                } else {
                    alert("Cédula no encontrada en la base de fundadores de la 1era Edición.");
                    btn.innerText = "Verificar Atleta";
                    btn.disabled = false;
                }

            } catch (e) {
                alert("Error conectando con la base de datos.");
                btn.disabled = false;
            }
        }

        // FUNCIÓN DE ENVÍO CON DIRECCIONAMIENTO POR GID
        async function procesarInscripcion() {
            const paquete = document.querySelector('input[name="paqueteBase"]:checked').value;
            
            // Decidir a qué GID enviar
            const gidDestino = (paquete === "30") ? GID_10K_FUNDADORES : GID_5K_2DA_EDICION;
            const nombreEdicion = (paquete === "30") ? "10K Fundadores" : "5K 2da Edición";

            const btn = document.getElementById('btnInscribir');
            btn.innerText = "PROCESANDO...";
            btn.disabled = true;

            const datos = new FormData();
            datos.append("Dorsal", dorsalActual);
            datos.append("Cedula", document.getElementById('cedulaAtleta').value);
            datos.append("Nombre", document.getElementById('nombreEnvio').value);
            datos.append("Telefono", document.getElementById('telefonoEnvio').value);
            datos.append("RefPago", document.getElementById('numReferenciaPago').value);
            datos.append("Monto", paquete);
            datos.append("TargetGID", gidDestino); // <--- ESTO LE DICE AL SCRIPT A QUÉ PESTAÑA IR

            try {
                // Envío al Apps Script
                await fetch(urlBaseDeDatos, { method: 'POST', body: datos, mode: 'no-cors' });
                
                // Mensaje para WhatsApp
                const textoWA = `*INSCRIPCIÓN RETO VIRTUAL*%0AEdición: ${nombreEdicion}%0ADorsal: #${dorsalActual}%0ANombre: ${document.getElementById('nombreEnvio').value}%0ARef: ${document.getElementById('numReferenciaPago').value}`;
                window.open(`https://wa.me/584127732710?text=${textoWA}`, '_blank');
                
            } catch (e) {
                alert("Error al guardar la inscripción.");
            } finally {
                btn.innerText = "CONFIRMAR INSCRIPCIÓN";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
