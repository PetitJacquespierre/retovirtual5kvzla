<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Oficial - Reto Virtual VZLA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .bg-boston { background-color: #001E50; }
        .text-accent { color: #00D2FF; }
        .bg-accent { background-color: #00D2FF; }
        .hidden-step { display: none; }
        
        input:focus, select:focus, textarea:focus { 
            border-color: #00D2FF !important; 
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1); 
        }
    </style>
</head>
<body class="text-slate-900">

    <div class="bg-[#001E50] text-white py-2 text-center text-[10px] font-bold uppercase tracking-[0.4em] z-50 relative border-b border-white/10">
        El estándar de oro del running virtual en Venezuela
    </div>

    <nav class="bg-[#001E50] sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 md:px-12">
            <div class="flex justify-between items-center h-28">
                <div class="flex items-center gap-6 cursor-pointer group" onclick="window.location.href='index.html'">
                    <img src="image_0.png" alt="Reto" class="h-20 md:h-22 w-auto object-contain brightness-125 transition-transform group-hover:scale-105" onerror="this.style.display='none'">
                    <div class="h-12 w-[1px] bg-white/20"></div>
                    <div class="flex flex-col text-left">
                        <span class="text-[9px] text-white/60 font-bold tracking-[0.3em] uppercase mb-1">Presentado por</span>
                        <span class="text-white font-black text-2xl md:text-4xl tracking-tighter leading-none group-hover:text-[#00D2FF] transition-colors italic uppercase">TEAMFS</span>
                    </div>
                </div>
                <a href="index.html" class="bg-white/10 hover:bg-[#00D2FF] hover:text-[#001E50] text-white px-6 py-2 rounded-full font-bold transition-all text-xs uppercase tracking-widest border border-white/20">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-16">
        
        <div id="paso-1" class="bg-white p-10 md:p-16 rounded-[3rem] shadow-2xl border border-slate-100 text-center">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6 text-[#001E50]">
                <i class="fa-solid fa-id-card text-3xl"></i>
            </div>
            <h2 class="text-[#001E50] font-black text-3xl uppercase tracking-tighter mb-4 italic">Verificación de Atleta</h2>
            <p class="text-slate-400 text-sm mb-10 italic">Acceso exclusivo para Fundadores y Registro General.</p>
            
            <div class="max-w-xs mx-auto space-y-4">
                <input type="text" id="cedulaAtleta" placeholder="V-00000000" 
                       class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 text-center font-bold outline-none transition-all text-lg">
                <button id="btnVerificar" onclick="validarAtleta()" class="w-full bg-[#001E50] text-white py-5 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-[#00D2FF] hover:text-[#001E50] transition-all shadow-xl">
                    Verificar Estatus
                </button>
            </div>
        </div>

        <div id="paso-2" class="hidden-step space-y-8 animate-fade-in">
            
            <div id="mensaje-bienvenida" class="bg-[#00D2FF]/10 border-2 border-[#00D2FF] p-8 rounded-[2rem] text-center text-[#001E50]"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="opciones-contenedor"></div>

            <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100">
                <h3 class="text-[#001E50] font-black text-2xl mb-8 uppercase italic border-b border-slate-50 pb-4">Datos de Despacho</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Nombre Completo</label>
                        <input type="text" id="nombreEnvio" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Teléfono de Contacto</label>
                        <input type="text" id="telefonoEnvio" placeholder="0412-0000000" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Estado</label>
                        <select id="estadoEnvio" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none font-bold">
                            <option value="Falcon">Falcón</option>
                            <option value="Caracas">Distrito Capital</option>
                            <option value="Lara">Lara</option>
                            <option value="Zulia">Zulia</option>
                            <option value="Carabobo">Carabobo</option>
                            <option value="Aragua">Aragua</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Ciudad</label>
                        <input type="text" id="ciudadEnvio" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Agencia de Envío</label>
                        <div class="flex gap-4">
                            <label class="flex-1 border-2 border-slate-100 p-3 rounded-xl cursor-pointer flex items-center justify-center gap-2 has-[:checked]:border-[#00D2FF] has-[:checked]:bg-[#00D2FF]/5 transition-all">
                                <input type="radio" name="agencia" value="ZOOM" checked> <span class="text-xs font-bold">ZOOM</span>
                            </label>
                            <label class="flex-1 border-2 border-slate-100 p-3 rounded-xl cursor-pointer flex items-center justify-center gap-2 has-[:checked]:border-[#00D2FF] has-[:checked]:bg-[#00D2FF]/5 transition-all">
                                <input type="radio" name="agencia" value="MRW"> <span class="text-xs font-bold">MRW</span>
                            </label>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Usuario Instagram</label>
                        <input type="text" id="igEnvio" placeholder="@usuario" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-3 outline-none">
                    </div>
                    <div class="md:col-span-2 flex flex-col gap-2">
                        <label class="text-[10px] font-bold uppercase text-slate-400 ml-2">Dirección Detallada (Oficina o Domicilio)</label>
                        <textarea id="direccionEnvio" rows="2" class="bg-slate-50 border-2 border-slate-100 rounded-2xl px-6 py-4 outline-none" placeholder="Indica nombre de oficina o dirección exacta"></textarea>
                    </div>
                </div>
            </div>

            <div class="bg-[#001E50] p-10 rounded-[3rem] text-white shadow-2xl">
                <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-8">
                    <div>
                        <h4 class="font-black text-2xl uppercase italic leading-none mb-2 text-white">Total a Pagar</h4>
                        <p class="text-white/30 text-[9px] uppercase tracking-[0.3em]">Tasa BCV: <span id="valor-tasa">--</span> Bs.</p>
                    </div>
                    <div class="text-right">
                        <span id="total-usd" class="text-5xl font-black text-[#00D2FF] block tracking-tighter">$0</span>
                        <span id="total-bs" class="text-sm font-bold text-white/50 tracking-widest">0.00 Bs.</span>
                    </div>
                </div>
                <button onclick="enviarInscripcion()" class="w-full bg-[#00D2FF] text-[#001E50] py-6 rounded-2xl font-black uppercase tracking-[0.2em] hover:scale-[1.02] transition-all shadow-xl flex items-center justify-center gap-4">
                    CONFIRMAR E INSCRIBIRME <i class="fa-brands fa-whatsapp text-xl"></i>
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-[#001E50] py-16 px-6 border-t border-white/5 text-center">
        <p class="text-white/30 text-[10px] uppercase tracking-[0.4em] mb-4 font-bold italic">Reto Virtual VZLA x TeamFS</p>
    </footer>

    <script>
        const tasaBCV = 487.119; 
        const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5yMHsenxCWE5kZBDUZ8UcYqDtdAHstfqXcvWkuYZPQ_4n2xSrfs6ptk7k21r1kcMHHLtWjz8SEHwl/pub?gid=1297920374&single=true&output=csv";
        
        let esFundador = false;
        let carrito = { p5k: 0, p10k: 0 };

        document.getElementById('valor-tasa').innerText = tasaBCV;

        async function validarAtleta() {
            const btn = document.getElementById('btnVerificar');
            const rawCi = document.getElementById('cedulaAtleta').value.trim();
            
            if(!rawCi) return alert("⚠️ Ingresa tu cédula.");

            // Limpiamos la cédula extrañendo SOLO los números
            const ciLimpia = rawCi.replace(/[^0-9]/g, ''); 

            if(ciLimpia.length < 5) return alert("⚠️ Ingresa una cédula válida.");

            // Indicador de carga
            const textoOriginal = btn.innerText;
            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            try {
                // Hacemos la consulta al CSV de Google Sheets
                const res = await fetch(urlCSV + "&t=" + new Date().getTime());
                if(!res.ok) throw new Error("No se pudo conectar a la base de datos");
                const data = await res.text();
                
                // Dividimos los datos por saltos de línea (funciona en Mac, Windows y Linux)
                const lineas = data.split(/\r?\n/);
                
                // Verificamos si la cédula limpia está en alguna de las líneas del Excel
                esFundador = lineas.some(linea => {
                    // Limpiamos la línea del excel dejando solo números para asegurar coincidencia exacta
                    const lineaLimpia = linea.replace(/[^0-9]/g, '');
                    return lineaLimpia.includes(ciLimpia) && ciLimpia.length > 4;
                });

                mostrarMenu();
            } catch (e) {
                console.error("Error validando:", e);
                // Si falla el internet o el enlace, por seguridad lo pasamos a general
                esFundador = false; 
                mostrarMenu();
            } finally {
                // Restaurar el botón
                btn.innerText = textoOriginal;
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }

        function mostrarMenu() {
            document.getElementById('paso-1').classList.add('hidden-step');
            document.getElementById('paso-2').classList.remove('hidden-step');
            const bienvenida = document.getElementById('mensaje-bienvenida');
            const contenedor = document.getElementById('opciones-contenedor');

            carrito = { p5k: 0, p10k: 0 };

            if(esFundador) {
                bienvenida.innerHTML = `<h3 class="font-black uppercase text-xl">¡Hola, Atleta Fundador!</h3><p class="text-xs opacity-70 uppercase tracking-widest mt-1 italic">Beneficios de temporada activados.</p>`;
                contenedor.innerHTML = `
                    <label class="bg-white p-8 rounded-3xl border-2 border-slate-100 cursor-pointer hover:border-[#00D2FF] has-[:checked]:border-[#00D2FF] has-[:checked]:bg-blue-50/30 transition-all block">
                        <input type="checkbox" onchange="updateCarrito(15, 'p5k')" class="mb-4 w-5 h-5 accent-[#00D2FF]">
                        <h4 class="font-black text-[#001E50] text-lg uppercase tracking-tighter">Edición 2 (5K)</h4>
                        <p class="text-3xl font-black text-[#00D2FF] mt-1">$15</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase mt-2">Medalla Acrílico + Kit</p>
                    </label>
                    <label class="bg-white p-8 rounded-3xl border-2 border-slate-100 cursor-pointer hover:border-[#00D2FF] has-[:checked]:border-[#00D2FF] has-[:checked]:bg-blue-50/30 transition-all block">
                        <input type="checkbox" onchange="updateCarrito(30, 'p10k')" class="mb-4 w-5 h-5 accent-[#00D2FF]">
                        <h4 class="font-black text-[#001E50] text-lg uppercase tracking-tighter">Edición 10K (Metal)</h4>
                        <p class="text-3xl font-black text-[#00D2FF] mt-1">$30</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase mt-2 italic">Precio Especial Fundador</p>
                    </label>
                `;
            } else {
                bienvenida.innerHTML = `<h3 class="font-black uppercase text-xl text-[#001E50]">Inscripción General</h3><p class="text-xs opacity-70 uppercase tracking-widest mt-1">Bienvenido a la Distancia Reina.</p>`;
                contenedor.innerHTML = `
                    <label class="bg-white p-8 rounded-3xl border-2 border-[#00D2FF] shadow-lg md:col-span-2 max-w-md mx-auto w-full block">
                        <input type="checkbox" checked disabled class="mb-4 w-5 h-5 accent-[#00D2FF]">
                        <h4 class="font-black text-[#001E50] text-lg uppercase tracking-tighter">10K Edición Especial</h4>
                        <p class="text-4xl font-black text-[#00D2FF] mt-1">$35</p>
                        <p class="text-[10px] text-slate-400 uppercase mt-4 font-bold leading-relaxed">
                            <i class="fa-solid fa-circle-check text-[#00D2FF] mr-2"></i> Medalla de Metal <br>
                            <i class="fa-solid fa-circle-check text-[#00D2FF] mr-2"></i> Franela Oficial <br>
                            <i class="fa-solid fa-circle-check text-[#00D2FF] mr-2"></i> Certificado Digital
                        </p>
                    </label>
                `;
                carrito.p10k = 35;
            }
            calc();
        }

        function updateCarrito(precio, key) {
            carrito[key] = event.target.checked ? precio : 0;
            calc();
        }

        function calc() {
            const total = carrito.p5k + carrito.p10k;
            document.getElementById('total-usd').innerText = `$${total}`;
            document.getElementById('total-bs').innerText = `${(total * tasaBCV).toFixed(2)} Bs.`;
        }

        function enviarInscripcion() {
            const ci = document.getElementById('cedulaAtleta').value;
            const nombre = document.getElementById('nombreEnvio').value;
            const tel = document.getElementById('telefonoEnvio').value;
            const estado = document.getElementById('estadoEnvio').value;
            const ciudad = document.getElementById('ciudadEnvio').value;
            const agencia = document.querySelector('input[name="agencia"]:checked').value;
            const direccion = document.getElementById('direccionEnvio').value;
            const total = document.getElementById('total-usd').innerText;
            const ig = document.getElementById('igEnvio').value;

            if(!nombre || !direccion || !tel || !ciudad) return alert("⚠️ Completa todos los datos de envío.");

            const msg = `🏆 *NUEVA INSCRIPCIÓN: RETO VIRTUAL 2026*%0A--------------------------------%0A👤 *ATLETA:* ${nombre}%0A💳 *CI:* ${ci}%0A📱 *TEL:* ${tel}%0A📸 *IG:* ${ig}%0A📍 *ENVÍO:* ${estado}, ${ciudad} (${agencia})%0A🏠 *DIRECCIÓN:* ${direccion}%0A💰 *TOTAL:* ${total}%0A--------------------------------%0A_Envío capture de pago a continuación..._`;
            // El enlace redirigirá directo a tu WhatsApp
            window.open(`https://wa.me/584127732710?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
