<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reto Virtual VZLA x Team FS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .scene {
      position: relative;
      width: 700px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    /* ===== LOGO RV ===== */
    .rv-logo {
  width: 260px;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  /* sin overflow: hidden */
}
.rv-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;       /* ← muestra todo sin recortar */
}

    /* ✅ CORRECTO — ambas propiedades en el mismo keyframe */
@keyframes runner-float {
  0%  { transform: translateY(0px);   filter: drop-shadow(0 0 10px ...); }
  50% { transform: translateY(-12px); filter: drop-shadow(0 0 22px ...); }
  100%{ transform: translateY(0px);   filter: drop-shadow(0 0 10px ...); }
}

    @keyframes runner-glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 180, 255, 0.5))
                         drop-shadow(0 0 20px rgba(220, 50, 200, 0.3)); }
      50%       { filter: drop-shadow(0 0 20px rgba(0, 220, 255, 0.9))
                         drop-shadow(0 0 35px rgba(220, 50, 200, 0.7)); }
    }

    /* ===== SEPARADOR ===== */
    .divider {
      width: 2px;
      height: 160px;
      background: linear-gradient(to bottom, transparent, #00d4ff, #dc32c8, transparent);
      animation: divider-pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes divider-pulse {
      0%, 100% { opacity: 0.4; transform: scaleY(0.85); }
      50%       { opacity: 1;   transform: scaleY(1); }
    }

    /* ===== LOGO TEAM FS ===== */
    .teamfs-logo {
      width: 180px;
      animation: teamfs-entrance 1s ease-out both,
                 teamfs-float 3s ease-in-out 1s infinite;
      filter: drop-shadow(0 0 10px rgba(255, 220, 0, 0.5));
    }

    @keyframes teamfs-entrance {
      from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes teamfs-float {
      0%, 100% { transform: translateY(0px); 
                 filter: drop-shadow(0 0 8px rgba(255, 220, 0, 0.4)); }
      50%       { transform: translateY(-8px); 
                 filter: drop-shadow(0 0 18px rgba(0, 220, 200, 0.8)); }
    }

    /* ===== PARTÍCULAS DE FONDO ===== */
    .particles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: particle-move linear infinite;
      opacity: 0;
    }

    @keyframes particle-move {
      0%   { transform: translateY(100%) translateX(0); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-120%) translateX(20px); opacity: 0; }
    }

    /* Generamos varias partículas con pseudo-clases */
    .p1  { width:4px; height:4px; background:#00d4ff; left:10%; animation-duration:3.2s; animation-delay:0s; }
    .p2  { width:3px; height:3px; background:#dc32c8; left:20%; animation-duration:2.8s; animation-delay:0.5s; }
    .p3  { width:5px; height:5px; background:#ffdd00; left:35%; animation-duration:3.5s; animation-delay:1s; }
    .p4  { width:2px; height:2px; background:#00d4ff; left:50%; animation-duration:2.5s; animation-delay:0.3s; }
    .p5  { width:4px; height:4px; background:#dc32c8; left:65%; animation-duration:3.8s; animation-delay:0.8s; }
    .p6  { width:3px; height:3px; background:#00ffcc; left:78%; animation-duration:2.9s; animation-delay:1.5s; }
    .p7  { width:5px; height:5px; background:#ffdd00; left:88%; animation-duration:3.1s; animation-delay:0.2s; }
    .p8  { width:2px; height:2px; background:#00d4ff; left:5%;  animation-duration:4s;   animation-delay:2s; }
    .p9  { width:4px; height:4px; background:#dc32c8; left:93%; animation-duration:2.6s; animation-delay:1.2s; }
    .p10 { width:3px; height:3px; background:#00ffcc; left:45%; animation-duration:3.3s; animation-delay:0.7s; }

    /* ===== TEXTO INFERIOR OPCIONAL ===== */
    .collab-text {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      animation: text-fade 3s ease-in-out infinite;
    }

    @keyframes text-fade {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="scene">

    <!-- Partículas -->
    <div class="particles">
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>
      <div class="particle p5"></div>
      <div class="particle p6"></div>
      <div class="particle p7"></div>
      <div class="particle p8"></div>
      <div class="particle p9"></div>
      <div class="particle p10"></div>
    </div>

    <!-- Logo RV (parte izquierda con corredor) -->
    <div class="rv-logo">
      <img src="img/RV-Isotipo-sinfondo.png" alt="Reto Virtual VZLA" />
    </div>

    <!-- Separador animado -->
    <div class="divider"></div>

    <!-- Logo Team FS -->
    <img class="teamfs-logo" src="img/teamfslogo.png" alt="Team FS" />

    <!-- Texto colaboración -->
    <div class="collab-text">Reto Virtual VZLA × Team FS</div>

  </div>
</body>
</html>
