<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Oficial - Reto Virtual 5K Venezuela</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Open Sans', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Montserrat', sans-serif; }
        .venezuela-gradient { background: linear-gradient(90deg, #FCD116 0%, #003893 50%, #CE1126 100%); height: 6px; width: 100%; position: fixed; top: 0; z-index: 60; }

        /* --- ESTILOS DEL CERTIFICADO --- */
        #seccion-certificado-externo { display: block; }
        .contenedor-certificado-objetivo { position: relative; width: 100%; max-width: 800px; margin: 0 auto; border-radius: 12px; overflow: hidden; display: none; }
        .imagen-fondo-certificado { width: 100%; height: auto; display: block; }
        .texto-nombre-certificado { position: absolute; top: 35%; left: 50%; transform: translateX(-50%); color: #FFFFFF; font-size: clamp(16px, 4.5vw, 36px); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin: 0; white-space: nowrap; font-family: 'Montserrat', sans-serif; }
        .texto-dorsal-certificado, .texto-tiempo-certificado { position: absolute; bottom: 27%; color: #FFFFFF; font-size: clamp(14px, 3.5vw, 26px); font-weight: 800; margin: 0; font-family: 'Montserrat', sans-serif; }
        .texto-dorsal-certificado { left: 25%; }
        .texto-tiempo-certificado { right: 12%; }    
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <div class="venezuela-gradient"></div>

    <nav class="bg-[#003893] shadow-md w-full z-40 py-4 mt-[6px]">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="image_0.png" alt="Logo" class="h-16 md:h-20 w-auto object-contain hidden sm:block" onerror="this.style.display='none'; document.getElementById('res-fallback-logo').classList.remove('hidden');">
                <i id="res-fallback-logo" class="fa-solid fa-person-running text-2xl text-white border border-yellow-400 rounded-full p-1.5 sm:hidden hidden"></i>
                <span class="font-heading font-extrabold text-lg md:text-xl tracking-tight text-white ml-2">
                    RETO VIRTUAL 5K <span class="text-yellow-400">VENEZUELA</span>
                </span>
            </div>
            <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <header class="py-12 px-4 text-center border-b border-gray-800 bg-black/50 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-yellow-500 rounded-full opacity-5 blur-3xl"></div>
        <span class="bg-blue-600 text-white font-bold px-4 py-1 rounded-full text-xs uppercase tracking-widest mb-4 inline-block shadow-lg animate-pulse">
            <i class="fa-solid fa-satellite-dish mr-1"></i> Sistema en Vivo
        </span>
        <h1 class="font-heading text-4xl md:text-5xl font-black mb-4 uppercase tracking-wide">
            Ranking <span class="text-yellow-400">Oficial</span>
        </h1>
        <p class="text-gray-400 max-w-2xl mx-auto">
            Aquí se registrarán los tiempos validados de nuestros 50 Fundadores. 
        </p>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-12 w-full">
        
        <div class="bg-blue-900/30 border border-blue-500/50 rounded-2xl p-6 mb-12 text-center flex flex-col items-center justify-center">
            <i class="fa-solid fa-stopwatch-20 text-5xl text-blue-400 mb-4 animate-spin-slow"></i>
            <h2 class="text-2xl font-bold text-white mb-2 font-heading">Fase de Carrera Activa</h2>
            <p class="text-blue-200">Los corredores están registrando sus tiempos (6 al 15 de Marzo). La tabla de posiciones se actualizará progresivamente.</p>
        </div>

        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <button id="btn-general" onclick="cambiarFiltro('GENERAL')" class="bg-[#00FFFF] text-black shadow-[0_0_15px_rgba(0,255,255,0.4)] font-black px-5 py-2 rounded-xl transition-all scale-105">GENERAL</button>
            <button id="btn-masculino" onclick="cambiarFiltro('MASCULINO')" class="bg-gray-800 hover:bg-blue-600 text-gray-300 font-bold px-5 py-2 rounded-xl transition-all border border-blue-500/30">MASCULINO</button>
            <button id="btn-femenino" onclick="cambiarFiltro('FEMENINO')" class="bg-gray-800 hover:bg-pink-600 text-gray-300
